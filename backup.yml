name: backup
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p dumps
          pg_dump "$DB_URL" --schema=public --no-owner --no-privileges -f "dumps/$(date +%F).sql"
          ls -t dumps/*.sql | tail -n +31 | xargs -r rm
      - name: Commit
        run: |
          git config user.name "backup-bot"
          git config user.email "backup@users.noreply.github.com"
          git add dumps
          git commit -m "backup $(date +%F)" || exit 0
          git push
